name: Build one platform update

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      runner:
        required: true
        type: string
      checks:
        default: false
        type: boolean

env:
  RUST_TOOLCHAIN: 1.98.1
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 1
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ inputs.platform }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Assign the build version
        id: version
        run: node tools/ci-release.mjs plan "$GITHUB_RUN_NUMBER"
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: fast-v1-${{ inputs.platform }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: fast-v1-${{ inputs.platform }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}-
      - name: Prepare the build version
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: node tools/ci-release.mjs prepare "$BUILD_VERSION"
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libwayland-dev libxkbcommon-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libudev-dev libfontconfig1-dev libvulkan-dev
      - name: Optional development checks
        if: inputs.checks
        run: |
          rustup component add rustfmt clippy
          cargo fmt --check
          cargo test --locked --quiet
          node --test tools/*.test.mjs experiments/herdr/tests/*.test.mjs
          cargo clippy --locked --all-targets -- -D warnings
      - name: Build for fast personal updates
        run: cargo build --locked --profile dev-release
      - name: Package Windows
        if: runner.os == 'Windows'
        run: |
          mkdir -p target/release-package
          cp target/dev-release/shina.exe target/release-package/shina.exe
      - name: Package Mac
        if: runner.os == 'macOS'
        run: sh tools/package-macos.sh target/dev-release/shina
      - name: Package portable Linux
        if: runner.os == 'Linux'
        run: sh tools/package-linux.sh target/dev-release/shina
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-${{ inputs.platform }}
          path: |
            target/release-package/shina.exe
            target/release-package/Shina-macos-aarch64.zip
            target/release-package/Shina-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish ${{ inputs.platform }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    # Only metadata/asset writes serialize. Slow builds never hold up another platform.
    concurrency:
      group: shina-release-${{ github.run_id }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: update-${{ inputs.platform }}
          path: target/release-assets
      - name: Publish this platform now
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_VERSION: ${{ needs.build.outputs.version }}
          BUILD_PLATFORM: ${{ inputs.platform }}
        run: node tools/ci-release.mjs publish "$BUILD_VERSION" "$BUILD_PLATFORM"
