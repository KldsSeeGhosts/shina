name: Build one platform update

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      runner:
        required: true
        type: string
      target:
        default: ''
        type: string
      checks:
        default: false
        type: boolean
    outputs:
      version:
        value: ${{ jobs.build.outputs.version }}

env:
  RUST_TOOLCHAIN: 1.98.1
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 1
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ inputs.platform }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Assign the build version
        id: version
        run: node tools/ci-release.mjs plan "$GITHUB_RUN_NUMBER"
      - name: Install Rust
        env:
          BUILD_TARGET: ${{ inputs.target }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          if [ -n "$BUILD_TARGET" ]; then rustup target add "$BUILD_TARGET"; fi
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: fast-v1-${{ inputs.platform }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: fast-v1-${{ inputs.platform }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}-
      - name: Prepare the build version
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: node tools/ci-release.mjs prepare "$BUILD_VERSION"
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libwayland-dev libxkbcommon-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libudev-dev libfontconfig1-dev libvulkan-dev
      - name: Optional development checks
        if: inputs.checks
        run: |
          rustup component add rustfmt clippy
          npm ci --prefix packages/mobile-client --include=dev --ignore-scripts
          cargo fmt --check
          cargo test --locked --quiet
          node --test tools/*.test.mjs
          cargo clippy --locked --all-targets -- -D warnings
      - name: Build for fast personal updates
        env:
          BUILD_TARGET: ${{ inputs.target }}
        run: |
          args=()
          if [ -n "$BUILD_TARGET" ]; then args+=(--target "$BUILD_TARGET"); fi
          cargo build --locked --profile dev-release "${args[@]}"
      - name: Package Windows
        if: runner.os == 'Windows'
        run: |
          mkdir -p target/release-package
          cp target/dev-release/shina.exe target/release-package/shina.exe
      - name: Package Mac
        if: runner.os == 'macOS'
        env:
          BUILD_TARGET: ${{ inputs.target }}
          SHINA_PACKAGE_ARCH: aarch64
        run: |
          binary=target/dev-release/shina
          if [ -n "$BUILD_TARGET" ]; then binary="target/$BUILD_TARGET/dev-release/shina"; fi
          sh tools/package-macos.sh "$binary"
      - name: Package portable Linux
        if: runner.os == 'Linux'
        run: sh tools/package-linux.sh target/dev-release/shina
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-${{ inputs.platform }}
          path: |
            target/release-package/shina.exe
            target/release-package/Shina-macos-aarch64.zip
            target/release-package/Shina-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
