name: Publish one verified platform update

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      version:
        required: true
        type: string

jobs:
  publish:
    name: Publish ${{ inputs.platform }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    # Core success and this platform's build are dependencies in the caller.
    # Only asset/manifest writes serialize, never a waiting runner.
    concurrency:
      group: shina-release-${{ github.run_id }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: update-${{ inputs.platform }}
          path: target/release-assets
      - name: Publish verified platform
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_VERSION: ${{ inputs.version }}
          BUILD_PLATFORM: ${{ inputs.platform }}
        run: node tools/ci-release.mjs publish "$BUILD_VERSION" "$BUILD_PLATFORM"
