name: Build and publish updates

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      checks:
        description: Also run tests, formatting and Clippy
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: shina-updates-main
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: 1.98.1
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 1
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  core:
    name: Core gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustup component add rustfmt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: core-v1-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: core-v1-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}-
      - name: Install Linux build libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libwayland-dev libxkbcommon-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libudev-dev libfontconfig1-dev libvulkan-dev
      - name: Check formatting
        run: cargo fmt --check
      - name: Run JS tests
        run: node --test tools/*.test.mjs
      - name: Run Rust tests
        run: cargo test --locked --quiet
  windows:
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/platform-update.yml
    with:
      platform: windows-x86_64
      runner: windows-2025
      checks: ${{ inputs.checks || false }}
  macos:
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/platform-update.yml
    with:
      platform: macos-aarch64
      runner: macos-15
      checks: ${{ inputs.checks || false }}
  linux:
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/platform-update.yml
    with:
      platform: linux-x86_64
      runner: ubuntu-24.04
      checks: ${{ inputs.checks || false }}
