name: Build and publish updates

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      checks:
        description: Also run tests, formatting and Clippy
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: shina-updates-main
  cancel-in-progress: true

jobs:
  windows:
    permissions:
      contents: write
    uses: ./.github/workflows/platform-update.yml
    with:
      platform: windows-x86_64
      runner: windows-2025
      checks: ${{ inputs.checks || false }}
  macos:
    permissions:
      contents: write
    uses: ./.github/workflows/platform-update.yml
    with:
      platform: macos-aarch64
      runner: macos-15
      checks: ${{ inputs.checks || false }}
  linux:
    permissions:
      contents: write
    uses: ./.github/workflows/platform-update.yml
    with:
      platform: linux-x86_64
      runner: ubuntu-24.04
      checks: ${{ inputs.checks || false }}
