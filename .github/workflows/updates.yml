name: Build and publish updates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      checks:
        description: Also run platform-specific tests and Clippy
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: shina-updates-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: 1.98.1
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 1
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  checks:
    name: Formatting, JavaScript and mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/mobile-client/package-lock.json
      - name: Check JavaScript
        run: node --test tools/*.test.mjs
      - name: Check the mobile client
        run: |
          npm ci --prefix packages/mobile-client --include=dev --ignore-scripts
          npm --prefix packages/mobile-client run typecheck
          npm --prefix packages/mobile-client test
          npm --prefix packages/mobile-client run build
      - name: Check Rust formatting
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          cargo +"$RUST_TOOLCHAIN" fmt --check

  rust:
    name: Rust build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/mobile-client/package-lock.json
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: core-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: core-v1-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: core-v1-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}-
      - name: Install build prerequisites
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libwayland-dev libxkbcommon-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libudev-dev libfontconfig1-dev libvulkan-dev
          npm ci --prefix packages/mobile-client --include=dev --ignore-scripts
      - name: Build once and run all Rust test harnesses concurrently
        run: node tools/ci-tests.mjs
      - name: Preserve normalized mobile fixture failures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-golden-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/tmp/mobile-golden/*.json
          if-no-files-found: ignore
          retention-days: 3
      # PR caches cannot help main or other PRs. Do not let copies of
      # gigabyte build trees evict the default branch's shared baseline.
      - name: Save compiled core dependencies even when a test fails
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.core-cache.outcome == 'success' && steps.core-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.core-cache.outputs.cache-primary-key }}

  core:
    name: Core gate
    needs: [checks, rust]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every check to pass
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          RUST_RESULT: ${{ needs.rust.result }}
        run: test "$CHECKS_RESULT" = success && test "$RUST_RESULT" = success

  windows:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/platform-update.yml
    with:
      platform: windows-x86_64
      runner: windows-2025
      checks: ${{ inputs.checks || false }}
  macos:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/platform-update.yml
    with:
      platform: macos-aarch64
      runner: macos-15
      checks: ${{ inputs.checks || false }}
  linux:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/platform-update.yml
    with:
      platform: linux-x86_64
      runner: ubuntu-24.04
      checks: ${{ inputs.checks || false }}

  publish-windows:
    needs: [core, windows]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/publish-update.yml
    with:
      platform: windows-x86_64
      version: ${{ needs.windows.outputs.version }}
  publish-macos:
    needs: [core, macos]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/publish-update.yml
    with:
      platform: macos-aarch64
      version: ${{ needs.macos.outputs.version }}
  publish-linux:
    needs: [core, linux]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/publish-update.yml
    with:
      platform: linux-x86_64
      version: ${{ needs.linux.outputs.version }}
