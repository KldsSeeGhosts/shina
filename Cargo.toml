[package]
name = "shina"
version = "0.11.0"
edition = "2024"
description = "A native Rune workspace for the Pi coding agent"
license = "MIT"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "a7f276c3630f85a06a0230295da4d2bd172d8d3b", default-features = false, features = ["accessibility", "embedded-fonts", "native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "a7f276c3630f85a06a0230295da4d2bd172d8d3b", features = ["markdown"] }
serde_json = "1"
sha2 = "0.10"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
rusqlite = { version = "0.38", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "io-util"] }
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", features = ["sink"] }
axum = { version = "0.8", features = ["ws"] }
getrandom = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Power", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
chrono-tz = "0.10"

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Personal development updates: reuse compiled dependencies and avoid whole-app LTO.
[profile.dev-release]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true

[profile.dev-release.package."*"]
opt-level = 2

