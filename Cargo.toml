[package]
name = "shina"
version = "0.12.0"
edition = "2024"
description = "A native Rune workspace for the Pi coding agent"
license = "MIT"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "22fcaf167b5e8d74e2ab173a698b7cf2053c5889", default-features = false, features = ["accessibility", "embedded-fonts", "native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "22fcaf167b5e8d74e2ab173a698b7cf2053c5889", features = ["markdown"] }
serde_json = "1"
serde_yaml_ng = "0.10"
serde_json_lenient = "0.2"
similar = "2"
pulldown-cmark = { version = "0.13", default-features = false }
sha2 = "0.10"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
rusqlite = { version = "0.38", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "io-util"] }
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", features = ["sink"] }
axum = { version = "0.8", features = ["ws"] }
getrandom = "0.4"
ignore = "0.4"
serde_yaml = "0.9"
regex = "1"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWindow", "NSView", "NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSEvent", "NSGraphics", "NSRunningApplication", "NSDragging", "NSPasteboard"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKPreferences", "WKNavigationDelegate", "WKNavigationAction", "WKNavigation", "WKUIDelegate", "WKFrameInfo", "WKSecurityOrigin", "WKScriptMessage", "WKScriptMessageHandler", "WKUserContentController", "WKWindowFeatures", "WKOpenPanelParameters", "WKSnapshotConfiguration", "WKContentRuleList", "WKContentRuleListStore", "WKURLSchemeHandler", "WKURLSchemeTask", "WKUserScript"] }
block2 = "0.6"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Power", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
chrono-tz = "0.10"

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
winresource = "0.1"

# Rune's Windows integrations require its vendored dependency patches at the app root.
[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "22fcaf167b5e8d74e2ab173a698b7cf2053c5889" }
winit = { git = "https://github.com/anomalyco/rune", rev = "22fcaf167b5e8d74e2ab173a698b7cf2053c5889" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Personal development updates: reuse compiled dependencies and avoid whole-app LTO.
[profile.dev-release]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true

[profile.dev-release.package."*"]
opt-level = 2

