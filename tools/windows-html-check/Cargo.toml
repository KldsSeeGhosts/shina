[package]
name = "shina-windows-html-check"
version = "0.0.0"
edition = "2024"
publish = false

# Type-check the platform implementation without a Windows C/C++ SDK for SQLite
# or Rune's shader build. The app and this check use the exact same source file.
[dependencies]
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi"] }
